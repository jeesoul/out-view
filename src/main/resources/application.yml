server:
  port: 8080

spring:
  application:
    name: outview-server
  main:
    allow-circular-references: true

  # 数据库配置 - 默认使用 H2 嵌入式数据库（零配置，数据持久化到文件）
  datasource:
    url: jdbc:h2:file:./data/outview;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 切换 MySQL 示例（取消注释并注释掉上面的 H2 配置）：
  # datasource:
  #   url: jdbc:mysql://localhost:3306/outview?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   username: root
  #   password: your_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  # 切换 MySQL 时改为：
  # jpa:
  #   database-platform: org.hibernate.dialect.MySQL8Dialect

  h2:
    console:
      enabled: false

# outView 管理后台账号配置
# 支持多个账号，密码明文存储（服务器内网使用）
outview-admin:
  users:
    - username: admin
      password: outview123
      role: ADMIN
    # 可继续添加更多账号：
    # - username: viewer
    #   password: view456
    #   role: VIEWER

# outView 配置
outview:
  # Netty 控制端口 (客户端注册/心跳)
  control-port: 7000
  # 数据端口范围 (RDP 转发)
  data-port-start: 6000
  data-port-end: 6500
  # 心跳超时时间 (秒)
  heartbeat-timeout: 90
  # 心跳间隔 (秒)
  heartbeat-interval: 30
  # Token 有效期 (天)
  token-expire-days: 30

  # SSL/TLS 配置
  ssl:
    enabled: false
    use-self-signed: true
    self-signed-cn: outview-server
    self-signed-validity-days: 365

# 日志配置
logging:
  level:
    root: INFO
    com.outview: DEBUG
    io.netty: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"